name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Check screenshot slots and prevent duplicate captures
        run: |
          python -m unittest discover -s docs/screenshots -p 'test_*.py'
          python docs/screenshots/validate.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build_setup
      - name: Run Unit Tests + Lint
        run: ./gradlew :app:lintLibreDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: app/build/reports/**/*.html
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build_setup
      - name: Run Unit Tests + Lint
        run: ./gradlew voiceUnitTest lintKotlin :app:assembleLibreDebug
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: "Unit Tests"
          annotate_only: true

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build_setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Critical Android Smoke Tests
        run: >-
          ./gradlew :app:voiceDeviceLibreDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=voice.app.AppLaunchSmokeTest,voice.app.SleepTimerIntegrationTest,voice.app.FeatureRegressionTest,voice.app.AndroidAutoMediaButtonTest
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'app/build/outputs/androidTest-results/**/TEST-*.xml'
          check_name: "Instrumentation Tests"
          annotate_only: true
