name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build_setup

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)
          if [[ "$RELEASE_TAG" != "v$version_name" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $version_name" >&2
            exit 1
          fi
          notes="fastlane/metadata/android/en-US/changelogs/$version_code.txt"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          echo "RELEASE_NOTES_PATH=$notes" >> "$GITHUB_ENV"

      - name: Decode Keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > signing/voiceplus-release.jks
          echo "storeFile=signing/voiceplus-release.jks" > signing/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> signing/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> signing/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> signing/keystore.properties

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleLibreRelease --no-configuration-cache

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify F-Droid reproducibility
        run: |
          python -m pip install apksigcopier==1.1.1
          repro_source="$RUNNER_TEMP/fdroid-rebuild"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$repro_source"
          git -C "$repro_source" checkout --detach "$GITHUB_SHA"
          # Apply the prebuild steps from the official F-Droid recipe.
          sed -i -e '/review/d' "$repro_source/features/review/play/build.gradle.kts"
          sed -i -e '/foojay/d' "$repro_source/settings.gradle.kts" "$repro_source/plugins/settings.gradle.kts"
          # F-Droid's scanner removes vendor-specific daemon provisioning.
          mv "$repro_source/gradle/gradle-daemon-jvm.properties" "$RUNNER_TEMP/fdroid-daemon-jvm.properties"
          (
            cd "$repro_source"
            ./gradlew :app:assembleLibreRelease --no-build-cache --no-configuration-cache
          )
          apksigcopier compare --unsigned \
            --verify-cmd "$ANDROID_HOME/build-tools/36.0.0/apksigner verify" \
            "$GITHUB_WORKSPACE/app/build/outputs/apk/libre/release/app-libre-release.apk" \
            "$repro_source/app/build/outputs/apk/libre/release/app-libre-release-unsigned.apk"

      - name: Rename APK for F-Droid Binaries URL
        run: mv app/build/outputs/apk/libre/release/app-libre-release.apk app/build/outputs/apk/libre/release/app-libre-release-signed.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/libre/release/app-libre-release-signed.apk
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: false
          draft: true
          prerelease: false
          make_latest: true
